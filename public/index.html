<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보고팡 | 오늘의 쿠팡 할인상품</title>
<meta name="description" content="매일 새롭게 확인하는 쿠팡 할인상품과 특가상품">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,"Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid #e8e8ec}.head{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:28px;font-weight:900}.logo b{color:#ff5a2f}.search{width:min(500px,50vw)}input{width:100%;padding:13px 16px;border:1px solid #dddfe5;border-radius:14px}
.hero{padding:42px 0 24px}.hero h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-2px}.hero p{color:#777}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.tab{border:1px solid #ddd;background:#fff;border-radius:12px;padding:11px 18px;white-space:nowrap;font-weight:800;cursor:pointer}.tab.on{background:#171717;color:#fff}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 24px}.cat{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 15px;white-space:nowrap}.cat.on{background:#171717;color:#fff}
.top{display:flex;justify-content:space-between;align-items:end}.top h2{font-size:22px}.top span{color:#888;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e8e9ed;border-radius:18px;overflow:hidden}.img{aspect-ratio:1;background:linear-gradient(135deg,#eee,#fafafa);display:grid;place-items:center;color:#aaa}.body{padding:14px}.badge{color:#ff4d24;font-size:12px;font-weight:900}.title{min-height:42px;font-size:14px;line-height:1.5;font-weight:700;margin-top:8px}.price{font-size:20px;font-weight:900;margin-top:10px}.discount{color:#ff4d24;margin-right:7px}.old{color:#aaa;text-decoration:line-through;font-size:12px}.buy{display:block;margin-top:13px;padding:10px;text-align:center;border-radius:10px;background:#171717;color:#fff;font-size:13px;font-weight:800}footer{padding:30px 0 45px;color:#777;font-size:12px;line-height:1.7}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{width:calc(100% - 20px)}.search{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>
<body>
<header><div class="wrap head"><a class="logo" href="/">보고<b>팡</b></a><div class="search"><input id="q" placeholder="상품을 검색해보세요"></div></div></header>
<main class="wrap">
<section class="hero"><h1>오늘의 할인은?</h1><p>매일 새롭게 확인하는 쿠팡 할인상품과 특가상품</p></section>
<nav id="tabs" class="tabs"></nav><nav id="cats" class="cats"></nav>
<div class="top"><div><h2 id="heading">오늘의 특가</h2><span id="description">쿠팡에서 오늘 확인할 수 있는 특가상품</span></div><span>자동 갱신 준비됨</span></div>
<section id="grid" class="grid"></section>
<footer><strong>쿠팡 파트너스 안내</strong><br>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</footer>
</main>
<script>
// 목적별 상품 데이터를 분리해 탭으로 표시합니다.
let productData = {
  specialDeals: [],
  trendingSearch: [],
  popularProducts: [],
  rocketProducts: []
};
// 상품 갱신을 중지한 상태에서도 새 탭 구조를 확인할 수 있는 임시 샘플 데이터입니다.
// 구조 확인용 미리보기 모드입니다. 실제 상품 API가 정상 응답하면 실제 데이터가 우선 표시됩니다.
const PREVIEW_MODE = true;

const SAMPLE_DATA = {
  specialDeals: [
    {id:"sample-1",name:"오늘의 특가 상품 예시",price:29900,originalPrice:39900,discountRate:25,image:"https://via.placeholder.com/500x500?text=Special",category:"생활용품",rocket:true,keyword:null,source:"오늘의 특가",url:"#"},
    {id:"sample-2",name:"인기 특가 상품 예시",price:45900,originalPrice:59900,discountRate:23,image:"https://via.placeholder.com/500x500?text=Deal",category:"가전",rocket:false,keyword:null,source:"오늘의 특가",url:"#"}
  ],
  trendingSearch: [
    {id:"sample-3",name:"오늘 많이 검색된 상품 예시",price:18900,originalPrice:null,discountRate:null,image:"https://via.placeholder.com/500x500?text=Trend",category:"식품",rocket:true,keyword:"검색어 A",source:"인기검색",url:"#"},
    {id:"sample-4",name:"인기검색 상품 예시",price:32900,originalPrice:39900,discountRate:18,image:"https://via.placeholder.com/500x500?text=Search",category:"디지털",rocket:false,keyword:"검색어 B",source:"인기검색",url:"#"}
  ],
  popularProducts: [
    {id:"sample-5",name:"인기상품 예시",price:27900,originalPrice:null,discountRate:null,image:"https://via.placeholder.com/500x500?text=Popular",category:"생활용품",rocket:true,keyword:null,source:"인기상품",url:"#"}
  ],
  rocketProducts: [
    {id:"sample-1",name:"오늘의 특가 상품 예시",price:29900,originalPrice:39900,discountRate:25,image:"https://via.placeholder.com/500x500?text=Rocket",category:"생활용품",rocket:true,keyword:null,source:"로켓배송",url:"#"},
    {id:"sample-3",name:"오늘 많이 검색된 상품 예시",price:18900,originalPrice:null,discountRate:null,image:"https://via.placeholder.com/500x500?text=Rocket",category:"식품",rocket:true,keyword:"검색어 A",source:"로켓배송",url:"#"}
  ]
};

let activeTab = "specialDeals";
let selectedCategory = "전체";

// 현재 선택된 탭의 상품 목록을 반환합니다.
function getActiveItems() {
  return productData[activeTab] || [];
}

// 상품 탭을 그립니다.
function drawTabs() {
  const tabs = [
    ["specialDeals", "오늘의 특가"],
    ["trendingSearch", "인기검색"],
    ["popularProducts", "인기상품"],
    ["rocketProducts", "로켓배송"]
  ];

  document.getElementById("tabs").innerHTML = tabs
    .map(([key, label]) =>
      '<button class="tab ' + (activeTab === key ? "on" : "") +
      '" data-tab="' + key + '">' + label + "</button>"
    )
    .join("");

  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.onclick = () => {
      activeTab = button.dataset.tab;
      selectedCategory = "전체";
      draw();
    };
  });
}

// 현재 탭의 카테고리 필터를 그립니다.
function drawCategories(items) {
  const categories = ["전체", ...new Set(items.map((item) => item.category).filter(Boolean))];

  document.getElementById("cats").innerHTML = categories
    .map((category) =>
      '<button class="cat ' + (category === selectedCategory ? "on" : "") +
      '" data-c="' + category + '">' + category + "</button>"
    )
    .join("");

  document.querySelectorAll("[data-c]").forEach((button) => {
    button.onclick = () => {
      selectedCategory = button.dataset.c;
      draw();
    };
  });
}

// 현재 탭에 맞는 제목과 설명을 표시합니다.
function drawHeader() {
  const headers = {
    specialDeals: ["오늘의 특가", "쿠팡에서 오늘 확인할 수 있는 특가상품"],
    trendingSearch: ["인기검색", "오늘 많이 검색된 키워드에서 찾은 상품"],
    popularProducts: ["인기상품", "공식 데이터로 확인 가능한 인기상품"],
    rocketProducts: ["로켓배송", "로켓배송이 가능한 상품"]
  };

  const [title, description] = headers[activeTab];
  document.getElementById("heading").textContent = title;
  document.getElementById("description").textContent = description;
}

// 상품 카드 목록을 그립니다.
function draw() {
  const items = getActiveItems();
  drawTabs();
  drawCategories(items);
  drawHeader();

  const query = document.getElementById("q").value.toLowerCase().trim();
  const list = items.filter(
    (item) =>
      (selectedCategory === "전체" || item.category === selectedCategory) &&
      item.name.toLowerCase().includes(query)
  );

  const grid = document.getElementById("grid");

  if (!list.length) {
    grid.innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#777;padding:40px 0">' +
      (activeTab === "popularProducts"
        ? "현재 공식 데이터로 제공되는 인기상품이 없습니다."
        : "해당 조건의 상품이 없습니다.") +
      "</p>";
    return;
  }

  grid.innerHTML = list.map((item) => {
    const discount = item.discountRate != null
      ? '<span class="discount">' + Number(item.discountRate) + '%</span>'
      : "";
    const original = item.originalPrice && Number(item.originalPrice) > Number(item.price)
      ? ' <span class="old">' + Number(item.originalPrice).toLocaleString("ko-KR") + "원</span>"
      : "";

    return '<article class="card">' +
      '<div class="img"><img src="' + item.image +
      '" alt="' + item.name.replace(/"/g, "&quot;") +
      '" loading="lazy" style="width:100%;height:100%;object-fit:contain"></div>' +
      '<div class="body">' +
      '<div class="badge">' +
      (item.rocket ? "로켓배송 · " : "") +
      item.source +
      "</div>" +
      '<div class="title">' + item.name + "</div>" +
      '<div class="price">' + discount +
      Number(item.price).toLocaleString("ko-KR") + "원" + original + "</div>" +
      '<a class="buy" href="' + item.url +
      '" target="_blank" rel="nofollow sponsored noopener">쿠팡에서 보기</a>' +
      "</div></article>";
  }).join("");
}

// 쿠팡 상품 API에서 목적별 상품 데이터를 가져옵니다.
async function loadProducts() {
  const grid = document.getElementById("grid");
  grid.innerHTML =
    '<p style="grid-column:1/-1;text-align:center;color:#777">상품을 불러오는 중...</p>';

  try {
    const response = await fetch("/api/products");
    const data = await response.json();

    if (!response.ok || !data || Array.isArray(data)) {
      throw new Error(data?.error || "상품 정보를 불러오지 못했습니다.");
    }

    productData = {
      specialDeals: Array.isArray(data.specialDeals) ? data.specialDeals : [],
      trendingSearch: Array.isArray(data.trendingSearch) ? data.trendingSearch : [],
      popularProducts: Array.isArray(data.popularProducts) ? data.popularProducts : [],
      rocketProducts: Array.isArray(data.rocketProducts) ? data.rocketProducts : []
    };

    // 자동 갱신을 중지한 동안에는 임시 샘플로 탭 UI를 확인할 수 있게 합니다.
    const hasProducts = Object.values(productData).some((list) => list.length > 0);
    if (!hasProducts) productData = SAMPLE_DATA;

    draw();
  } catch (error) {
    // 상품 API가 현재 중지되어 있어도 탭 구조를 확인할 수 있도록 미리보기 데이터를 표시합니다.
    if (PREVIEW_MODE) {
      productData = SAMPLE_DATA;
      draw();
      console.warn("미리보기 데이터 사용:", error.message);
      return;
    }

    grid.innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#777">' +
      (error.message || "상품 정보를 불러오지 못했습니다.") +
      "</p>";
    console.error(error);
  }
}

// 검색어가 바뀌면 현재 탭을 즉시 필터링합니다.
document.getElementById("q").oninput = draw;
loadProducts();
</script>
</body>
</html>
